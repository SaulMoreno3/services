<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada | Saúl Preda</title>
    <meta name="description" content="La página que buscas no existe. Vuelve al inicio del portfolio de Saúl Preda.">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/portfolio/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full text-center">
        <!-- 404 Animation -->
        <div class="mb-8">
            <div class="text-8xl font-bold text-blue-600 mb-4 animate-bounce">404</div>
            <div class="w-24 h-24 mx-auto bg-blue-100 rounded-full flex items-center justify-center mb-6">
                <svg class="w-12 h-12 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 12h6m-6-4h6m2 5.291A7.962 7.962 0 0112 15c-2.34 0-4.29-1.009-5.824-2.412M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                </svg>
            </div>
        </div>
        
        <!-- Error Message -->
        <h1 class="text-3xl font-bold text-gray-900 mb-4">
            Página no encontrada
        </h1>
        <p class="text-lg text-gray-600 mb-8">
            Lo siento, la página que buscas no existe o ha sido movida.
        </p>
        
        <!-- Action Buttons -->
        <div class="space-y-4">
            <a 
                href="/portfolio/" 
                class="inline-block w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-300"
            >
                Volver al inicio
            </a>
            
            <div class="flex gap-3">
                <a 
                    href="/portfolio/proyectos/" 
                    class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium py-2 px-4 rounded-lg transition-colors text-sm"
                >
                    Proyectos
                </a>
                <a 
                    href="/portfolio/docencia/" 
                    class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium py-2 px-4 rounded-lg transition-colors text-sm"
                >
                    Docencia
                </a>
                <a 
                    href="/portfolio/contacto/" 
                    class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium py-2 px-4 rounded-lg transition-colors text-sm"
                >
                    Contacto
                </a>
            </div>
        </div>
        
        <!-- Additional Help -->
        <div class="mt-8 text-sm text-gray-500">
            <p>¿Sigues teniendo problemas?</p>
            <a 
                href="mailto:tu-email@dominio" 
                class="text-blue-600 hover:text-blue-700 font-medium"
            >
                Contáctame directamente
            </a>
        </div>
    </div>
    
    <!-- Go back button -->
    <script>
        // Add go back functionality
        document.addEventListener('DOMContentLoaded', function() {
            // If user came from within the site, show a go back option
            if (document.referrer && document.referrer.includes(window.location.hostname)) {
                const backButton = document.createElement('button');
                backButton.innerHTML = '← Volver atrás';
                backButton.className = 'mt-4 text-blue-600 hover:text-blue-700 font-medium text-sm';
                backButton.onclick = () => window.history.back();
                
                const actionDiv = document.querySelector('.space-y-4');
                actionDiv.appendChild(backButton);
            }
        });
    </script>
</body>
</html>
